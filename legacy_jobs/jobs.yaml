    feeds_report: Claims ops - Open exposure
    risk: internal
    wave: 3
  - job_id: J07
    lang: tsql
    source_path: legacy_jobs/tsql/J07_claims_per_policy.sql
    keys: [line_of_business]
    output: claims_per_policy
    feeds_report: Pricing - Claim frequency
    risk: internal
    wave: 3
  - job_id: J08
    lang: tsql
    source_path: legacy_jobs/tsql/J08_closed_claims.sql
    keys: [policy_id]
