    source_path: legacy_jobs/tsql/J12_payments_2022.sql
    keys: [policy_id]
    output: payments_2022_by_policy
    feeds_report: Finance - Cash paid 2022
    risk: regulatory
    wave: 3
  - job_id: J13
    lang: tsql
    source_path: legacy_jobs/tsql/J13_days_to_first_claim.sql
    keys: [policy_id]
    output: days_to_first_claim
    feeds_report: Underwriting - Early claims
    risk: internal
    wave: 3
  - job_id: J14
    lang: tsql
    source_path: legacy_jobs/tsql/J14_home_settled.sql
    keys: [policy_id]
